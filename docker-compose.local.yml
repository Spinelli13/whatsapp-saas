services:
  postgres:
    image: postgres:18-alpine
    container_name: crm_postgres
    environment:
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: crm_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: