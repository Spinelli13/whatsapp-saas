name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - 'database/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'railway.json'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment: production
    # Only deploy if tests pass (the ci-cd.yml runs first on the same push)
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway deploy --service ${{ secrets.RAILWAY_SERVICE }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Run production migrations
        run: railway run node scripts/migrate-prod.js
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          NODE_ENV: production
